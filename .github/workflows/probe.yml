name: Probe sources (ground truth)

on:
  push:
    branches: [claude/tsuki-scans-pwa-nirbqo]
    paths:
      - "scripts/probe-mangadex.mjs"
      - "scripts/probe-cors.mjs"
      - "scripts/probe-proxies.mjs"
      - "scripts/probe-uploads.mjs"
      - "scripts/probe-animesama.mjs"
      - "gateway/**"
      - ".github/workflows/probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe Anime-Sama (FR scans — priority source ground truth)
        run: node scripts/probe-animesama.mjs
      - name: CORS reality check (decides if a gateway is even needed)
        run: node scripts/probe-cors.mjs
      - name: Public CORS proxies — is zero-deploy reading viable?
        run: node scripts/probe-proxies.mjs
      - name: Stable image host (uploads.mangadex.org) — zero-relay reader linchpin
        run: node scripts/probe-uploads.mjs
      - name: Probe MangaDex (FR + EN, chapters + page images)
        run: node scripts/probe-mangadex.mjs
      - name: Gateway test against real MangaDex (proves reading path)
        run: node gateway/test.mjs
