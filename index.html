<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#07070b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tsuki" />
    <meta name="description" content="Tsuki Scans — Your next read, found in the dark. A premium manga discovery & reading experience." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Tsuki Scans</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="splash-mark" width="60" height="60" viewBox="0 0 48 48" fill="none">
        <defs>
          <linearGradient id="sg" x1="8" y1="6" x2="42" y2="44" gradientUnits="userSpaceOnUse">
            <stop stop-color="#dcccff" />
            <stop offset="1" stop-color="#6a45d8" />
          </linearGradient>
          <mask id="sc">
            <rect width="48" height="48" fill="#000" />
            <circle cx="24" cy="24" r="18" fill="#fff" />
            <circle cx="33" cy="18" r="15.5" fill="#000" />
          </mask>
        </defs>
        <rect width="48" height="48" fill="url(#sg)" mask="url(#sc)" />
      </svg>
      <div class="splash-word">TSUKI</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
