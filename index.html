    <div id="splash" aria-hidden="true">
      <svg class="splash-mark" width="62" height="62" viewBox="0 0 48 48" fill="none">
        <defs>
          <mask id="sc">
            <rect width="48" height="48" fill="#000" />
            <circle cx="23" cy="24" r="12" fill="#fff" />
            <circle cx="30" cy="19.5" r="10.5" fill="#000" />
          </mask>
        </defs>
        <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" fill="#d8412a" />
        <rect width="48" height="48" fill="#fdf1e7" mask="url(#sc)" />
      </svg>
      <div class="splash-word">TSUKI</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
